
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Redes Sociais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Seu tempo nas redes sociais</h1>

        <p>Descubra quanto tempo você passa nas redes sociais e reflita sobre seus hábitos digitais.</p>

        <label for="horas">Quantas horas por dia você passa nas redes sociais?</label>

        <input type="number" id="horas" min="0" max="24" step="0.5" placeholder="Ex: 5">

        <button id="calcular">Calcular meu tempo</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
